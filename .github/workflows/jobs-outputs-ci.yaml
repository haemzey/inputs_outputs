name: 02 - Job Outputs Demo

on:
  workflow_dispatch:

jobs:
  deploy_job:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        id: deploy_1
        run: |
          echo "Deploying application..."
          sleep 3
          echo "deployment_url=https://github.com/haemzey" >> $GITHUB_OUTPUT

    outputs:
      deployment_url: ${{ steps.deploy_1.outputs.deployment_url }}

  notification_job:
    runs-on: ubuntu-latest
    needs: deploy_job
    steps:
      - name: Send Notification
        run: |
          echo "Sending notification..."
          echo "Application URL: ${{ needs.deploy_job.outputs.deployment_url }}"
          echo "Notification sent successfully."