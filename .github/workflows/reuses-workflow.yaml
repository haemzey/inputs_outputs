name: 03 - Reusable Workflow Outputs Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature

jobs:
  deploy_job:
    uses: ./.github/workflows/centralized-deploy.yaml

  notification_job:
    runs-on: ubuntu-latest
    needs: deploy_job 
    steps:
      - name: Send Notification
        run: |
          echo "Sending notification..."
          echo "Application URL:"
          echo "${{ needs.deploy_job.outputs.deployment_url }}"
          echo "Notification sent successfully."